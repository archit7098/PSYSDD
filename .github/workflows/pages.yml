name: Validate & Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate data integrity
        run: node scripts/validate-data.js
      - name: Ensure generated docs & knowledge pack are up to date with data
        run: |
          node scripts/generate-docs.js
          if ! git diff --quiet -- docs knowledge/psysdd-knowledge-pack.md skill/references/psysdd-knowledge-pack.md; then
            echo "::error::Generated files are out of date. Run 'node scripts/generate-docs.js' and commit the result."
            git --no-pager diff --stat -- docs knowledge/psysdd-knowledge-pack.md skill/references/psysdd-knowledge-pack.md
            exit 1
          fi

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
